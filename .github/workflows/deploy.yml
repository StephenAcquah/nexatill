name: Deploy NexaTill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Configure API URL
        env:
          NEXATILL_API_URL: ${{ vars.NEXATILL_API_URL }}
        run: |
          if [ -z "$NEXATILL_API_URL" ]; then
            echo "Missing repository variable NEXATILL_API_URL"
            exit 1
          fi
          printf "window.NEXATILL_API_URL = '%s';\n" "$NEXATILL_API_URL" > config.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

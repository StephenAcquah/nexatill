services:
  - type: web
    name: nexatill-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:setup && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexatill-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
databases:
  - name: nexatill-db
    plan: free